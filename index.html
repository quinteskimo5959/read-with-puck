<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read with Puck</title>
<meta name="theme-color" content="#FFF7EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Read with Puck">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EA; --card:#FFFFFF; --ink:#2A2733; --soft:#6E6878; --line:#EADFCB;
  --vow:#E0483E; --con:#2F5DA8; --magic:#8A4FD6; --silent:#B9B0A2; --heart:#C2338A;
  --hl:#FFE27A; --accent:#F2A93B; --good:#2E9B6A;
  --scale:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Andika',system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
.top h1{font-size:22px;margin:0;flex:1;display:flex;align-items:center;gap:8px}
.iconbtn{border:0;background:var(--card);border-radius:14px;width:44px;height:44px;font-size:20px;box-shadow:0 1px 0 var(--line)}
.wrap{padding:6px 16px 24px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 0 var(--line);margin-bottom:14px}
.hero{display:flex;gap:14px;align-items:center}
.hero .big{font-size:56px;font-weight:700;color:var(--vow);min-width:90px;text-align:center;line-height:1}
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:18px;font-weight:700;background:var(--accent);color:#2A2733}
.btn.alt{background:#EFE6D6}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.muted{color:var(--soft);font-size:15px}
.stage h2{font-size:17px;margin:18px 2px 8px;color:var(--soft);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.tile{background:var(--card);border:0;border-radius:18px;padding:10px 6px;text-align:center;box-shadow:0 2px 0 var(--line);position:relative;min-height:104px}
.tile .num{font-size:12px;color:var(--soft)}
.tile .snd{font-size:30px;font-weight:700;line-height:1.2}
.tile .ttl{font-size:12px;line-height:1.2;color:var(--soft);margin-top:2px}
.tile .star{position:absolute;top:6px;right:8px;font-size:16px}
.tile.next{outline:3px solid var(--accent)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:13px;color:var(--soft)}
.nav button b{display:block;font-size:22px}
.nav button.on{color:var(--ink);font-weight:700}
.hidden{display:none!important}
/* reader */
.reader{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.rbar{display:flex;align-items:center;gap:8px;padding:10px 12px}
.rbar .t{flex:1;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{flex:1;overflow:auto;padding:18px 22px;display:flex;align-items:center;justify-content:center}
.text{font-size:calc(34px * var(--scale));line-height:1.9;max-width:680px;width:100%}
.text.long{font-size:calc(24px * var(--scale));line-height:1.75;align-self:flex-start}
.w{border-radius:8px;padding:0 1px;cursor:pointer}
.w:active{background:#F3E7D1}
.w .hl{background:var(--hl);border-radius:5px}
.w sup{color:var(--heart);font-size:.45em}
ruby rt{font-size:.42em;color:var(--soft);font-family:'Doulos SIL','Charis SIL','Gentium Plus','Lucida Sans Unicode',system-ui,sans-serif;letter-spacing:.02em}
.rfoot{display:flex;gap:10px;padding:10px 14px 14px;align-items:center}
.rfoot .btn{flex:1;font-size:20px;padding:16px}
.dots{display:flex;gap:5px;justify-content:center;padding:0 0 6px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:#E5D9C3}
.dots i.on{background:var(--accent)}
.pgnum{text-align:center;color:var(--soft);font-size:14px;padding-bottom:4px}
.intro{text-align:center}
.intro .snds{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.sndbtn{border:0;background:var(--card);border-radius:22px;padding:14px 22px;font-size:64px;font-weight:700;color:var(--vow);box-shadow:0 3px 0 var(--line);min-width:110px}
.sndbtn small{display:block;font-size:15px;color:var(--soft);font-weight:400}
.wordlist{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wordlist button{border:0;background:var(--card);border-radius:12px;padding:8px 12px;font-size:24px;box-shadow:0 2px 0 var(--line)}
/* zoom */
.sheet-bg{position:fixed;inset:0;background:rgba(40,34,28,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 8px}
.chip{border:0;background:var(--card);border-radius:18px;padding:8px 8px 10px;min-width:calc(var(--cs,64px) * .9);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;position:relative}
.chip .l{font-size:var(--cs,64px);font-weight:700;line-height:1.1}
.chip .grp{height:6px;border-radius:3px;width:80%;margin-top:2px;background:currentColor;opacity:.55}
.chip .ip{font-size:18px;color:var(--soft);margin-top:4px;font-family:'Doulos SIL','Charis SIL','Gentium Plus',system-ui,sans-serif}
.chip .tag{font-size:12px;color:var(--soft)}
.chip.v{color:var(--vow)} .chip.c{color:var(--con)} .chip.m{color:var(--magic)} .chip.s{color:var(--silent)} .chip.tr{color:var(--heart)}
.chip.lit{transform:translateY(-6px);box-shadow:0 8px 0 var(--accent)}
.chip .hrt{position:absolute;top:2px;right:6px;font-size:14px}
.zipa{text-align:center;font-size:22px;color:var(--soft);font-family:'Doulos SIL','Charis SIL','Gentium Plus',system-ui,sans-serif}
.zrow{display:flex;gap:10px;margin-top:14px}
.zrow .btn{flex:1}
.note{background:#FBEAF3;color:#7A1F55;border-radius:14px;padding:10px 12px;font-size:15px;margin-top:10px}
.note.info{background:#EEF3FB;color:#26457A}
.linkbtn{background:none;border:0;color:var(--con);font-size:15px;text-decoration:underline;padding:8px;display:block;margin:6px auto 0}
/* sounds */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px}
.sgrid button{border:0;background:var(--card);border-radius:16px;padding:10px 4px;box-shadow:0 2px 0 var(--line);text-align:center}
.sgrid button .l{font-size:30px;font-weight:700}
.sgrid button .e{font-size:13px;color:var(--soft)}
.sgrid button .ip{font-size:14px;color:var(--soft)}
.sgrid button.lock{opacity:.38}
.sgrid button.v .l{color:var(--vow)} .sgrid button.c .l{color:var(--con)} .sgrid button.m .l{color:var(--magic)}
/* forms */
label.f{display:block;font-weight:700;margin:12px 0 6px}
input[type=text],textarea,select{width:100%;font-family:inherit;font-size:17px;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
textarea{min-height:140px;resize:vertical}
.ideas{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ideas button{border:0;background:#EFE6D6;border-radius:999px;padding:7px 12px;font-size:14px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:16px}
.seg button.on{border-color:var(--accent);background:#FFF1D6;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lab{flex:1}
.row .lab small{display:block;color:var(--soft);font-size:13px}
.sw{position:relative;width:54px;height:32px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#DDD3C2;border-radius:99px;transition:.2s}
.sw span:before{content:'';position:absolute;width:26px;height:26px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--good)}
.sw input:checked+span:before{transform:translateX(22px)}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small{font-size:14px;padding:9px 12px;border-radius:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2A2733;color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;z-index:40;max-width:90vw;text-align:center}
.celebrate{position:fixed;inset:0;z-index:30;background:rgba(255,247,234,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.celebrate .bigstar{font-size:110px;animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #E5D9C3;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

.badge{display:inline-block;font-size:12px;background:#EFE6D6;color:var(--ink);border-radius:999px;padding:2px 8px;margin-left:4px;font-weight:700;vertical-align:middle}
.badge.ok{background:#DDF2E6;color:#1F6B47}
.meter{position:relative;height:14px;background:#EFE6D6;border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--good);border-radius:99px}
.meter s{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.sndmini{font-size:26px;font-weight:700;color:var(--vow);min-width:56px;text-align:center}
.pill{background:#FBEAF3;color:#7A1F55;border-radius:999px;padding:6px 12px;font-size:18px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--soft);justify-content:center;margin-top:8px}
.legend span b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<div class="top">
  <h1><span id="duck"></span><span>Read with Puck</span></h1>
  <button class="iconbtn" id="gear" aria-label="Settings">⚙️</button>
</div>

<main class="wrap">
  <section id="v-stories"></section>
  <section id="v-sounds" class="hidden"></section>
  <section id="v-library" class="hidden"></section>
  <section id="v-make" class="hidden"></section>
  <section id="v-settings" class="hidden"></section>
</main>

<nav class="nav">
  <button data-v="stories" class="on"><b>📖</b>Stories</button>
  <button data-v="sounds"><b>🔤</b>Sounds</button>
  <button data-v="library"><b>📚</b>Library</button>
  <button data-v="make" id="navMake" class="hidden"><b>✨</b>Make</button>
</nav>

<div id="reader" class="reader hidden"></div>
<div id="sheet" class="sheet-bg hidden"></div>
<div id="overlay" class="hidden"></div>

<script>

const DUCK = '<svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="34" cy="42" rx="22" ry="15" fill="#FFD23F"/><circle cx="24" cy="24" r="13" fill="#FFD23F"/><path d="M6 25 L15 21 L15 29 Z" fill="#F2803B"/><circle cx="21" cy="21" r="2.4" fill="#2A2733"/><path d="M36 38 q10 -8 18 2" stroke="#E8B523" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';

async function initCloud(){

async function putBook(b){

// sample (Claude) capability

// ---------- speech ----------
let voices = [];

  if(S.settings.voice){ const v = voices.find(v => v.voiceURI === S.settings.voice); if(v) return v; }

  for(const p of pref){ const v = voices.find(v => v.name.includes(p)); if(v) return v; }

  return Promise.resolve(false);
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function sayFor(ch){ return P.SAY[ch.ipa] || ch.t.toLowerCase(); }
const NAMES = {a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',n:'en',o:'oh',p:'pee',q:'cue',r:'are',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zee'};
function spellLetters(t){ return t.toUpperCase().replace(/[^A-Z]/g,'').split('').join('. ') + '.'; }
function chipName(ch){ return spellLetters(ch.t); }
function unitName(u){ return spellLetters(unitLabel(u).replace('_','')); }

async function speakChip(ch, word){
  stopSpeak(); await wait(40);
  // Letter name(s), then a simple word with the same sound
  let name = chipName(ch);
  if(ch.magic){
    const v = word.chips.find(c => c.magic && !c.silent);
    if(ch.silent) return speak('E. It is silent. It makes the vowel say its name. Like in ' + (exFor(v) || word.word) + '.');

  if(!S.settings.example) return speak(name);

}
async function soundOut(word, onStep){
  stopSpeak(); await wait(40);
  const my = speakToken;
  const parts = word.chips.map((c,i)=>({c,i})).filter(x => !x.c.punct);
  for(const x of parts){
    if(my !== speakToken) return;
    onStep(x.i);
    await speak(chipName(x.c), 1);
    await wait(220);
  }
  if(my !== speakToken) return;
  onStep(-1);
  await wait(250);
  await speak(word.word.toLowerCase() === 'i' ? 'I' : word.word);
}

// ---------- helpers ----------
let toastT = null;

function unitLabel(u){ return (U[u] && U[u].label) || u; }

function nextLevel(){ const lv = LD.LEVELS.find(l => !S.done[l.id]); return lv || null; }

  if(ch.tricky) return 'tr';
  if(ch.silent) return ch.magic ? 'm' : 's';
  if(ch.magic) return 'm';

function applySize(){ document.documentElement.style.setProperty('--scale', {S:0.82,M:1,L:1.22}[S.settings.size] || 1); }
applySize();

// ---------- reading level grader ----------
const UNIT_LVL = {}, TRICKY_LVL = {};
LD.LEVELS.forEach(l => { l.n.concat(l.also).forEach(u => { if(!(u in UNIT_LVL)) UNIT_LVL[u] = l.num; }); l.tricky.forEach(t => { t = t.toLowerCase(); if(!(t in TRICKY_LVL)) TRICKY_LVL[t] = l.num; }); });
LD.BEYOND.forEach(u => { if(!(u in UNIT_LVL)) UNIT_LVL[u] = 53; });
const BONUS = 53, NEWHEART = 99, MAXL = LD.LEVELS.length;

function wordLevel(word){
  const p = P.parseWord(word), lw = p.lw;
  let t = TRICKY_LVL[lw]; if(t === undefined && lw.endsWith('s')) t = TRICKY_LVL[lw.slice(0,-1)];

  else for(const c of p.chips){ if(c.punct) continue; const ul = c.u ? UNIT_LVL[c.u] : undefined; if(ul === undefined){ lv = NEWHEART; break; } if(ul > lv) lv = ul; }

}

const gradeCache = new Map();
function gradeText(text, key){

  if(ck && gradeCache.has(ck)) return gradeCache.get(ck);
  const words = [];
  for(const tk of P.tokenize(text)) if(tk.w) words.push(tk.text);
  const N = words.length;
  if(!N) return null;
  const memo = new Map();
  const lvOf = w => { const k = w.toLowerCase(); if(!memo.has(k)) memo.set(k, wordLevel(w)); return memo.get(k); };
  const levels = words.map(lvOf).sort((a,b) => a-b);
  const target = levels[Math.max(0, Math.ceil(N * 0.95) - 1)];
  const nowPct = Math.round(100 * levels.filter(l => l <= her).length / N);
  // what she still needs (from words above her level)
  const units = new Map(), hearts = new Map(), hard = new Map();
  for(const w of words){
    const lv = lvOf(w); if(lv <= her) continue;
    const p = P.parseWord(w), lw = p.lw;
    const tl = TRICKY_LVL[lw] ?? (lw.endsWith('s') ? TRICKY_LVL[lw.slice(0,-1)] : undefined);
    if(tl !== undefined && tl <= target){ hearts.set(lw, (hearts.get(lw)||0) + 1); continue; }
    if(P.EXC[lw] && p.heart){ hearts.set(lw, (hearts.get(lw)||0) + 1); continue; }
    for(const c of p.chips){
      if(c.punct || !c.u || UNIT_LVL[c.u] === undefined || UNIT_LVL[c.u] <= her) continue;
      const e = units.get(c.u) || { u:c.u, n:0, words:new Set() }; e.n++; if(e.words.size < 4) e.words.add(lw); units.set(c.u, e);
    }
    if(lv >= BONUS) hard.set(lw, (hard.get(lw)||0) + 1);
  }
  const sentences = Math.max(1, (text.match(/[.!?]+/g) || []).length);
  const syl = words.reduce((a,w) => a + syllables(w), 0);

  const res = { N, target, her, nowPct, fk: Math.round(fk * 10) / 10,
    units: [...units.values()].sort((a,b) => (UNIT_LVL[a.u] - UNIT_LVL[b.u]) || (b.n - a.n)),
    hearts: [...hearts.entries()].sort((a,b) => b[1]-a[1]).map(x => x[0]),
    hard: [...hard.entries()].sort((a,b) => b[1]-a[1]).map(x => x[0]).slice(0, 12) };

}
function levelLabel(n){
  if(n <= 0) return 'Level 1';
  if(n <= MAXL){ const l = LD.LEVELS[n-1]; return `Level ${n} (${l.n.map(unitLabel).join(', ')})`; }
  if(n === BONUS) return 'After the ladder (bonus sounds)';
  return 'After the ladder (extra heart words)';
}
function badgeFor(g){
  if(!g) return '';
  const ok = g.target <= g.her;
  const t = g.target <= MAXL ? 'Level ' + g.target : 'Beyond ladder';
  return `<span class="badge ${ok?'ok':''}">${ok ? '✓ ' : ''}${t}</span>`;
}
function showGrade(title, text, key){
  const g = gradeText(text, key);
  const o = $('#overlay'); o.className = 'sheet-bg';
  if(!g){ o.innerHTML = `<div class="sheet"><p>No words to check.</p><button class="btn full" id="gClose">OK</button></div>`; $('#gClose').onclick = () => { o.className='hidden'; o.innerHTML=''; }; return; }
  const ready = g.target <= g.her;
  const headline = g.target <= MAXL ? `Easy to read at <b>${esc(levelLabel(g.target))}</b>` : `Easy to read <b>${esc(levelLabel(g.target).toLowerCase())}</b>`;
  const herTxt = g.her === 0 ? "She hasn't finished a story yet." : `She has finished up to <b>Level ${g.her}</b>.`;
  let h = `<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">Reading check</b><button class="iconbtn" id="gClose" aria-label="Close">✕</button></div>
    <p class="muted" style="margin:4px 0 10px">${esc(title)} · ${g.N} words · ${g.fk < 1 ? 'kindergarten to first grade' : 'about grade ' + g.fk.toFixed(1)}</p>
    <div class="card" style="margin:0 0 12px"><div style="font-size:19px">${headline}</div>
    <p style="margin:8px 0 4px">${herTxt} She can sound out <b>${g.nowPct}%</b> of the words now.</p>
    <div class="meter"><i style="width:${g.nowPct}%"></i><s style="left:95%"></s></div>
    <p class="muted" style="margin:6px 0 0">${ready ? 'She should be able to read this on her own.' : 'Easy reading means she can sound out about 95 of every 100 words (the line on the bar).'}</p></div>`;
  if(!ready && g.units.length){
    h += `<b>Sounds to master first</b><div style="margin:8px 0 12px">`;
    for(const e of g.units.slice(0, 12)){
      const lv = UNIT_LVL[e.u];
      h += `<div class="item"><div class="sndmini">${esc(unitShow(e.u))}</div><div class="grow"><b style="font-weight:400">${esc([...e.words].join(', '))}</b><span class="muted">${e.n} time${e.n>1?'s':''} · ${lv <= MAXL ? 'taught in Level ' + lv : 'bonus sound'}</span></div>${lv <= MAXL ? `<button class="btn alt small" data-lvl="L${lv}">Practice</button>` : ''}</div>`;
    }
    h += `</div>`;
  }
  if(!ready && g.hearts.length) h += `<b>Heart words to learn</b><div class="wordlist" style="justify-content:flex-start;margin:8px 0 12px">${g.hearts.slice(0,16).map(w => `<span class="pill">${esc(w)}</span>`).join('')}</div>`;
  if(!ready && g.hard.length) h += `<b>Hardest words</b><p class="muted" style="margin:4px 0 0">${esc(g.hard.join(', '))}</p>`;
  h += `</div>`;
  o.innerHTML = h;
  $('#gClose').onclick = () => { o.className='hidden'; o.innerHTML=''; };
  o.onclick = e => { if(e.target === o){ o.className='hidden'; o.innerHTML=''; } };
  o.querySelectorAll('[data-lvl]').forEach(b => b.onclick = () => { o.className='hidden'; o.innerHTML=''; openLevel(b.dataset.lvl); });
}

// ---------- shared stories from the GitHub repo ----------
let shared = LS.get('rwp_shared') || []; // {id,name,title,pages}
function parseStoryFile(name, raw){
  const txt = raw.replace(/\r/g,'').replace(/^﻿/,'');
  const lines = txt.split('\n');
  let i = 0; while(i < lines.length && !lines[i].trim()) i++;
  let title = (lines[i] || name).trim().replace(/^#+\s*/,'').replace(/^title:\s*/i,'');
  const body = lines.slice(i+1).join('\n').replace(/^\s*-{3,}\s*$/gm, '\n\n').trim();
  let pages = body.split(/\n\s*\n/).map(p => p.split('\n').map(l => l.trim()).filter(Boolean).join('\n')).filter(Boolean);
  if(pages.length > 40 || pages.some(p => p.split(/\s+/).length > 150)) pages = paginate(body, 75);
  if(!pages.length) pages = [title];
  return { id: 'g-' + name, name, title, pages };
}
function repoInfo(){
  const host = location.hostname;
  if(!host.endsWith('.github.io')) return null;
  const owner = host.split('.')[0];
  const seg = location.pathname.split('/').filter(Boolean);
  const repo = seg.length && !seg[0].includes('.') ? seg[0] : host;
  return { owner, repo };
}
async function loadShared(){
  if(!/^https?:$/.test(location.protocol)) return;
  let names = null;
  const ri = repoInfo();
  if(ri){
    try{
      const r = await fetch(`https://api.github.com/repos/${ri.owner}/${ri.repo}/contents/stories`, { cache:'no-store' });
      if(r.ok) names = (await r.json()).filter(f => f.type === 'file' && /\.(txt|md)$/i.test(f.name) && !/^readme/i.test(f.name)).map(f => f.name);
    }catch(e){}
  }
  if(!names){
    try{ const r = await fetch('stories/index.json', { cache:'no-store' }); if(r.ok){ const j = await r.json(); names = Array.isArray(j) ? j : (j.stories || []); } }catch(e){}
  }
  if(!names) return;
  const out = [];
  for(const n of names){
    try{ const r = await fetch('stories/' + encodeURIComponent(n), { cache:'no-cache' }); if(r.ok) out.push(parseStoryFile(n, await r.text())); }catch(e){
      const old = shared.find(s => s.name === n); if(old) out.push(old);
    }
  }
  out.sort((a,b) => a.title.localeCompare(b.title, undefined, { numeric:true, sensitivity:'base' }));
  const changed = JSON.stringify(out) !== JSON.stringify(shared);
  shared = out; LS.set('rwp_shared', shared);
  if(changed && (current === 'library' || current === 'stories')) render();
}

function renderSounds(){
  const nx = nextLevel();
  const upto = nx ? nx.num : LD.LEVELS.length + 1;
  const { known } = LD.knownAt(upto);
  let h = `<div class="card"><b>Letter sounds</b><p class="muted" style="margin:4px 0 0">Tap any sound to hear its letters and a word that uses it. Bright ones are sounds from the stories so far. The ‿ means magic e: the vowel and the e work together, like a_e in cake.</p>
  <div class="legend"><span><b style="background:var(--vow)"></b>vowel sound</span><span><b style="background:var(--con)"></b>consonant sound</span><span><b style="background:var(--magic)"></b>magic e</span></div></div>`;
  const order = [];
  LD.LEVELS.forEach(l => l.n.concat(l.also).forEach(u => { if(!order.includes(u)) order.push(u); }));
  LD.BEYOND.forEach(u => order.push(u));
  const blocks = [['Sounds in the stories', order.filter(u => !LD.BEYOND.includes(u))], ['Bonus sounds for real books', LD.BEYOND]];
  for(const [title, list] of blocks){
    h += `<div class="stage"><h2>${title}</h2><div class="sgrid">`;
    for(const u of list){
      const d = U[u]; if(!d) continue;
      const cls = u.includes('_e') ? 'm' : (d.v ? 'v' : 'c');
      h += `<button class="${cls} ${known.has(u)?'':'lock'}" data-u="${u}"><div class="l">${esc(unitShow(u))}</div>${S.settings.ipa && d.ipa ? `<div class="ip">/${esc(d.ipa)}/</div>`:''}<div class="e">${esc(d.ex)}</div></button>`;
    }
    h += `</div></div>`;
  }
  $('#v-sounds').innerHTML = h;
  $('#v-sounds').querySelectorAll('[data-u]').forEach(b => b.onclick = async () => {
    const u = b.dataset.u, d = U[u];
    stopSpeak(); await wait(40);
    if(u === 'e_silent'){ speak('E. It is silent. Like in have.'); return; }
    speak(unitName(u) + (u.endsWith('_e') && u.length===3 ? ' With the silent E.' : '') + ' Like in ' + d.ex + '.');
  });
}

async function addBook(){
  const text = $('#bText').value.trim();
  if(!text){ toast('Paste some text first.'); return; }
  const b = { id: 'b' + Date.now().toString(36), title: $('#bTitle').value.trim() || text.split(/\s+/).slice(0,4).join(' '), text, page:0, chars:text.length, added:Date.now() };
  $('#bAdd').disabled = true; $('#bAdd').innerHTML = '<span class="spin"></span>';
  if(DB){ try{ await putBook(b); }catch(e){ toast("Couldn't save to your account. Keeping it on this device."); LS.set('rwp_book_'+b.id, text); } }

  books.unshift(b); saveBooksLocal(); renderLibrary(); toast('Added "' + b.title + '"');

  { id:'B1', name:'All sounds · longer stories', grade:'end of first grade: two-syllable words, simple dialogue, 4 to 6 short sentences per page' },
  { id:'B2', name:'Early chapter book', grade:'second grade, like Frog and Toad or Mercy Watson: short chapters, mostly familiar words, a few new longer words' },
  { id:'B3', name:'Chapter book', grade:'third grade, like Magic Tree House: richer vocabulary, paragraphs, a mystery or adventure' },
  { id:'B4', name:'Harry Potter ready', grade:'fourth to fifth grade, close to the Harry Potter books: rich vocabulary, longer paragraphs, magic and adventure (an original story, not using Harry Potter characters or text)' }

function levelName(id){
  if(!id) return '';
  if(id.startsWith('B')){ const b = BEYOND_LEVELS.find(x => x.id === id); return b ? b.name : id; }
  const lv = LD.LEVELS.find(l => l.id === id); return lv ? `Level ${lv.num}: ${lv.n.map(unitLabel).join(', ')}` : id;
}

function unitDescribe(u){
  const d = U[u]; const l = unitLabel(u);
  if(u.endsWith('_e') && u.length===3) return `${l} (magic e, as in ${d.ex})`;
  if(u === 'e_silent') return 'a silent final e (as in have)';
  if(u === 'ed') return '-ed ending (as in jumped, landed)';
  return `${l} (as in ${d.ex})`;
}
async function makeStory(){
  if(!SAMPLE || mk.busy) return;
  mk.busy = true; mk.msg = ''; renderMake();
  const topic = mk.topic.trim() || 'a funny animal';
  const isB = mk.level.startsWith('B');
  const lenPages = { S: isB?4:5, M: isB?6:8, L: isB?10:12 }[mk.len];
  let prompt, known, tricky, focus = [];
  if(!isB){
    const lv = LD.LEVELS.find(l => l.id === mk.level);
    ({ known, tricky } = LD.knownAt(lv.num));
    focus = lv.n;
    prompt = `You write decodable phonics stories for a young child who is learning to read.

Write an original story about: ${topic}.

The child can ONLY read words built from these spelling patterns:
${[...known].map(unitDescribe).join('; ')}.

She also knows these heart words (sight words): ${[...tricky].join(', ') || 'none'}.

Every single word must be readable with those patterns or be a heart word. Do not use any other spelling patterns. For example, if "ee" is not listed, do not write "see". Names must also follow the patterns.

Focus sound for this story: ${lv.n.map(unitDescribe).join(' and ')}. Use it in lots of words so she gets practice spotting it.

Style: entertaining and warm, with a little problem and a funny or happy ending. ${lv.num < 12 ? 'Very short sentences of 2 to 5 words, one or two sentences per page.' : lv.num < 30 ? 'Short sentences, one to three per page.' : 'Sentences up to about 10 words, two to four per page.'} Mostly one-syllable words. Repetition is good. Nothing scary.

Write exactly ${lenPages} pages. Before answering, use the check_words tool on all the words you plan to use and replace any word it rejects.

Reply with only JSON in this shape: {"title": "...", "pages": ["page one text", "page two text"]}`;
  } else {
    const b = BEYOND_LEVELS.find(x => x.id === mk.level);
    prompt = `Write an original children's story about: ${topic}.
Reading level: ${b.grade}.
It should be entertaining, with characters she will want to read more about, and a satisfying ending. Nothing scary beyond gentle adventure peril.
Write exactly ${lenPages} pages. Each page is a short passage that fits on a phone screen (${mk.level==='B1'?'25 to 45':mk.level==='B2'?'40 to 70':'60 to 110'} words). Use paragraphs separated by blank lines where it helps.
Reply with only JSON in this shape: {"title": "...", "pages": ["page one text", "page two text"]}`;
  }
  const checkTool = known ? [{
    name:'check_words',
    description:'Checks whether words are readable for this child. Pass the words you plan to use. Returns the ones that use sounds she has not learned yet.',
    inputSchema:{ type:'object', properties:{ words:{ type:'array', items:{ type:'string' } } }, required:['words'] },
    execute: (inp) => {
      const bad = [];
      for(const w of (inp.words||[])) for(const tk of P.tokenize(String(w))) if(tk.w && !P.checkWord(tk.text, known, tricky).ok) bad.push(tk.text);
      return { rejected: [...new Set(bad)].slice(0,80), note: bad.length ? 'Replace these words.' : 'All words are fine.' };
    }
  }] : undefined;
  try{
    let out = await SAMPLE.json(prompt, { tools: checkTool, modelTier: 'default' });
    let story = normStory(out);
    if(!story) throw { message:'The story came back in an odd shape. Try again.' };
    if(known){
      let bad = findBad(story, known, tricky);
      if(bad.length){
        const fix = `${prompt}\n\nHere is a draft:\n${JSON.stringify(story)}\n\nThese words use sounds she has not learned: ${bad.join(', ')}. Rewrite the story replacing every one of them. Reply with only the JSON.`;
        try{ const s2 = normStory(await SAMPLE.json(fix, { tools: checkTool, modelTier: 'default' })); if(s2) story = s2; }catch(e){}
        bad = findBad(story, known, tricky);
        if(bad.length) mk.msg = `Heads up: ${bad.length} word${bad.length>1?'s use':' uses'} a sound she hasn't learned yet (${bad.slice(0,6).join(', ')}). Tap them to sound them out together.`;
      }
    }
    const s = { id:'s'+Date.now().toString(36), title:story.title, pages:story.pages, level:mk.level, focus, topic, created:Date.now() };
    stories.unshift(s); saveStoriesLocal();
    if(DB) libRef.collection('stories').doc(s.id).set(s).catch(()=>{});
    mk.busy = false; renderMake();
    openStory(s.id);
  }catch(e){
    mk.busy = false;
    mk.msg = e && e.code === 'rate_limited' ? 'Claude is busy right now. Wait a minute and try again.' : (e && e.code === 'not_granted' ? 'The story maker was turned off for this page.' : ((e && e.message) || 'Something went wrong. Try again.'));
    if(e && e.code === 'not_granted') SAMPLE = null;
    renderMake();
  }
}
function normStory(o){
  if(typeof o === 'string'){ try{ o = JSON.parse(o.slice(o.indexOf('{'), o.lastIndexOf('}')+1)); }catch(e){ return null; } }
  if(!o || !Array.isArray(o.pages) || !o.pages.length) return null;
  return { title: String(o.title || 'A New Story').slice(0,80), pages: o.pages.map(p => String(p)).filter(Boolean).slice(0,20) };
}
function findBad(story, known, tricky){
  const bad = new Set();
  for(const pg of story.pages.concat([story.title])) for(const tk of P.tokenize(pg)) if(tk.w && !P.checkWord(tk.text, known, tricky).ok) bad.add(tk.text);
  return [...bad];
}

// ---------- settings ----------
function renderSettings(){
  const st = S.settings;
  const sw = (k, lab, sub) => `<div class="row"><div class="lab">${lab}<small>${sub}</small></div><label class="sw"><input type="checkbox" data-k="${k}" ${st[k]?'checked':''}><span></span></label></div>`;
  let h = `<div class="card"><b>Settings</b>
  <label class="f" for="sName">Reader's name</label><input type="text" id="sName" value="${esc(st.name)}" placeholder="Her name">
  ${sw('ipa','Show sound symbols','Dictionary symbols like /kæt/ above words and under each sound.')}
  ${sw('example','Say an example word','Tapping a letter says its name and a word with the same sound: "A, like in apple".')}
  ${sw('highlight','Highlight the new sound','Marks the new sound in each story so she can spot it.')}
  <label class="f">Text size</label><div class="seg">${['S','M','L'].map(k=>`<button data-size="${k}" class="${st.size===k?'on':''}">${{S:'Small',M:'Medium',L:'Large'}[k]}</button>`).join('')}</div>
  <label class="f" for="sRate">Voice speed</label><input type="range" id="sRate" min="0.5" max="1.2" step="0.05" value="${st.rate}" style="width:100%">
  <label class="f" for="sVoice">Voice</label><select id="sVoice"><option value="">Automatic</option>${voices.map(v=>`<option value="${esc(v.voiceURI)}" ${st.voice===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>
  <button class="btn alt full" id="sTest" style="margin-top:10px">🔊 Test: "M, like in mop"</button>
  </div>
  <div class="card"><b>About the sounds</b><p class="muted">Tapping a letter or group says the letter name, then a simple word with the same sound. In "cat", the a says "A, like in apple". In "rake", the a and e say "A, with the silent E, like in cake". Enhanced voices from your phone's settings (on iPhone: Accessibility, Spoken Content, Voices) sound clearer.</p>
  <p class="muted">Stars and settings are saved ${where==='account'?'to your Claude account.':'on this device.'}</p>
  <button class="btn alt full" id="sReset">Reset stars</button>
  <p class="muted" style="text-align:center;margin:12px 0 0">Version ${APP_VERSION}</p></div>`;
  $('#v-settings').innerHTML = h;
  $('#v-settings').querySelectorAll('[data-k]').forEach(i => i.onchange = () => { st[i.dataset.k] = i.checked; saveState(); });
  $('#v-settings').querySelectorAll('[data-size]').forEach(b => b.onclick = () => { st.size = b.dataset.size; applySize(); saveState(); renderSettings(); });
  $('#sName').onchange = e => { st.name = e.target.value.trim(); saveState(); };
  $('#sRate').onchange = e => { st.rate = parseFloat(e.target.value); saveState(); };
  $('#sVoice').onchange = e => { st.voice = e.target.value; saveState(); };
  $('#sTest').onclick = async () => { stopSpeak(); await wait(40); speak('M. Like in mop.'); };
  $('#sReset').onclick = () => confirmBox('Clear all the stars and start the ladder over?', () => { S.done = {}; saveState(); toast('Stars cleared.'); });
}

// ---------- reader ----------
let R = null;
function openLevel(id){
  const lv = LD.LEVELS.find(l => l.id === id);
  const { known, tricky } = LD.knownAt(lv.num);
  R = { kind:'level', id, title:lv.title, pages:lv.pages, page:-1, focus:new Set(lv.n), tricky, known, lv };
  showReader();
}
function openStory(id){
  const s = stories.find(x => x.id === id); if(!s) return;
  const isB = !s.level || s.level.startsWith('B');
  let tricky = new Set(), known = null;
  if(!isB){ const lv = LD.LEVELS.find(l => l.id === s.level); ({ known, tricky } = LD.knownAt(lv.num)); }
  R = { kind:'story', id, title:s.title, pages:s.pages, page: isB ? 0 : -1, focus:new Set(s.focus||[]), tricky, known, long:isB, lv: isB ? null : LD.LEVELS.find(l => l.id === s.level) };
  showReader();
}
function openShared(id){
  const s = shared.find(x => x.id === id); if(!s) return;
  const { known, tricky } = LD.knownAt(Math.max(1, herLevel()));
  const long = s.pages.some(p => p.split(/\s+/).length > 30);
  R = { kind:'shared', id:s.name, title:s.title, pages:s.pages, page:0, focus:new Set(), tricky, known, long };
  showReader();
}
async function openBook(id){
  const b = books.find(x => x.id === id); if(!b) return;
  toast('Opening...');
  const text = await loadBookText(b);
  if(!text){ toast("Couldn't load this book."); return; }
  const per = { S:110, M:75, L:50 }[S.settings.size] || 75;
  const pages = paginate(text, per);
  R = { kind:'book', id, title:b.title, pages, page:Math.min(b.page||0, pages.length-1), focus:new Set(), tricky:new Set(), long:true, book:b };
  showReader();
}
function paginate(text, max){
  const paras = text.replace(/\r/g,'').split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean);
  const out = []; let cur = [], cnt = 0;
  const flush = () => { if(cur.length){ out.push(cur.join('\n\n')); cur = []; cnt = 0; } };
  for(const p of paras){
    const n = p.split(/\s+/).length;
    if(n > max){
      flush();
      const sents = p.match(/[^.!?]+[.!?]+["”’']?\s*|[^.!?]+$/g) || [p];
      let buf = '', bc = 0;
      for(const s of sents){ const sc = s.split(/\s+/).length; if(bc + sc > max && buf){ out.push(buf.trim()); buf = ''; bc = 0; } buf += s; bc += sc; }
      if(buf.trim()){ cur = [buf.trim()]; cnt = bc; }
      continue;
    }
    if(cnt + n > max) flush();
    cur.push(p); cnt += n;
  }
  flush();
  return out.length ? out : [text.slice(0, 2000)];
}
function wordHtml(text){
  const p = P.parseWord(text);
  const fixed = aiFix.get(p.lw);
  const chips = fixed || p.chips;
  let inner;
  if(S.settings.highlight && R.focus.size && !fixed){
    inner = chips.map(c => R.focus.has(c.u) ? `<span class="hl">${esc(c.t)}</span>` : esc(c.t)).join('');
  } else inner = esc(text);
  const heart = R.kind !== 'book' && p.heart && R.tricky.has(p.lw) ? '<sup>♥</sup>' : '';
  const span = `<span class="w" data-w="${esc(text)}">${inner}${heart}</span>`;
  if(S.settings.ipa) return `<ruby>${span}<rt>/${esc(chips.map(c=>c.ipa).join(''))}/</rt></ruby>`;
  return span;
}
function pageHtml(t){
  return t.split(/\n\n/).map(par => '<p style="margin:0 0 .6em">' + P.tokenize(par).map(tk => tk.w ? wordHtml(tk.text) : esc(tk.text).replace(/\n/g,'<br>')).join('') + '</p>').join('');
}
function showReader(){
  stopSpeak();
  const el = $('#reader'); el.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  drawPage();
}
function closeReader(){ stopSpeak(); $('#reader').classList.add('hidden'); document.body.style.overflow = ''; R = null; render(); }
function drawPage(){
  const el = $('#reader');
  const total = R.pages.length;
  let body, foot;
  if(R.page === -1){
    const words = [];
    if(R.lv){
      for(const pg of R.pages) for(const tk of P.tokenize(pg)) if(tk.w){
        const p = P.parseWord(tk.text);
        if(p.chips.some(c => R.focus.has(c.u)) && !words.some(w => w.toLowerCase() === tk.text.toLowerCase()) && words.length < 8) words.push(tk.text);
      }
    }
    const hearts = R.lv ? R.lv.tricky : [];
    body = `<div class="intro"><div class="muted" style="font-size:18px">New sound${R.focus.size>1?'s':''}</div>
      <div class="snds">${[...R.focus].map(u => `<button class="sndbtn" data-u="${u}">${esc(unitShow(u))}${S.settings.ipa?`<small>/${esc(U[u].ipa)}/</small>`:''}<small>${esc(U[u].ex)}</small></button>`).join('')}</div>
      <p style="font-size:20px">Tap it to hear it in a word. Then find it in the story!</p>
      ${words.length ? `<div class="wordlist">${words.map(w=>`<button data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`:''}
      ${hearts.length ? `<p class="muted" style="margin-top:18px">New heart words ♥ (learn by heart):</p><div class="wordlist">${hearts.map(w=>`<button data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>` : ''}
      </div>`;
    foot = `<button class="btn" id="rNext">Start reading ▶</button>`;
  } else {
    body = `<div class="text ${R.long?'long':''}">${pageHtml(R.pages[R.page])}</div>`;
    const last = R.page === total - 1;
    foot = `<button class="btn alt" id="rPrev" ${R.page===0 && R.kind!=='level' && !(R.kind==='story'&&R.lv)?'disabled':''} style="flex:.6">◀</button>
      <button class="btn" id="rNext">${last ? (R.kind==='book' ? 'The end' : 'I read it! ⭐') : 'Next ▶'}</button>`;
  }
  const dots = total <= 24 ? `<div class="dots">${R.pages.map((_,i)=>`<i class="${i===R.page?'on':''}"></i>`).join('')}</div>` : `<div class="pgnum">Page ${R.page+1} of ${total}</div>`;
  el.innerHTML = `<div class="rbar"><button class="iconbtn" id="rClose" aria-label="Close">✕</button><div class="t">${esc(R.title)}</div>
    ${R.page>=0?'<button class="iconbtn" id="rRead" aria-label="Read this page aloud">🔊</button>':''}
    <button class="iconbtn" id="rIpa" aria-label="Sound symbols" style="font-size:15px;font-weight:700;${S.settings.ipa?'background:#FFE9B8':''}">/ə/</button></div>
    <div class="page" id="rPage">${body}</div>${R.page>=0?dots:''}<div class="rfoot">${foot}</div>`;
  $('#rClose').onclick = closeReader;
  $('#rIpa').onclick = () => { S.settings.ipa = !S.settings.ipa; saveState(); drawPage(); };
  const rr = $('#rRead'); if(rr) rr.onclick = () => { stopSpeak(); setTimeout(()=>speak(R.pages[R.page].replace(/\n+/g,' ')), 40); };
  const pv = $('#rPrev'); if(pv) pv.onclick = () => { if(R.page > 0) R.page--; else if(R.lv) R.page = -1; drawPage(); savePos(); };
  $('#rNext').onclick = () => {
    if(R.page < total - 1){ R.page++; drawPage(); savePos(); $('#rPage').scrollTop = 0; }
    else finish();
  };
  el.querySelectorAll('[data-w]').forEach(w => w.onclick = () => openZoom(w.dataset.w));
  el.querySelectorAll('.sndbtn').forEach(b => b.onclick = async () => {
    const u = b.dataset.u, d = U[u]; stopSpeak(); await wait(40);
    speak(unitName(u) + (u.endsWith('_e') && u.length===3 ? ' With the silent E.' : '') + ' Like in ' + d.ex + '.');
  });
  // swipe
  const pg = $('#rPage'); let sx = null;
  pg.ontouchstart = e => { sx = e.touches[0].clientX; };
  pg.ontouchend = e => { if(sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
    if(Math.abs(dx) > 70){ if(dx < 0 && R.page < total - 1){ R.page++; drawPage(); savePos(); } else if(dx > 0 && R.page > 0){ R.page--; drawPage(); savePos(); } } };
}
function savePos(){ if(R && R.kind === 'book'){ R.book.page = Math.max(0, R.page); saveBookPage(R.book); } }
function finish(){
  if(R.kind === 'book'){ closeReader(); return; }
  const key = R.kind === 'level' ? R.id : (R.kind === 'shared' ? 'G-' + R.id : 'S-' + R.id);
  S.done[key] = Date.now(); saveState();
  stopSpeak(); setTimeout(()=>speak('Great reading' + (S.settings.name ? ', ' + S.settings.name : '') + '!'), 60);
  const o = $('#overlay'); o.className = 'celebrate';
  const nx = R.kind === 'level' ? LD.LEVELS[R.lv.num] : null;
  o.innerHTML = `<div class="bigstar">⭐</div><div style="font-size:30px;font-weight:700;margin:8px 0">You read it!</div>
    <p class="muted" style="font-size:18px">${esc(R.title)}</p>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:16px">
    ${nx ? `<button class="btn" id="cNext">Next: ${esc(nx.title)} (${esc(nx.n.map(unitLabel).join(', '))}) ▶</button>` : ''}
    <button class="btn alt" id="cAgain">Read it again</button><button class="btn alt" id="cHome">Done</button></div>`;
  const shut = () => { o.className = 'hidden'; o.innerHTML = ''; };
  if(nx) $('#cNext').onclick = () => { shut(); openLevel(nx.id); };
  $('#cAgain').onclick = () => { shut(); R.page = R.lv ? -1 : 0; drawPage(); };
  $('#cHome').onclick = () => { shut(); closeReader(); };
}

// ---------- word zoom ----------
const aiFix = new Map();
function openZoom(text){
  stopSpeak();
  const base = P.parseWord(text);
  const fixed = aiFix.get(base.lw);
  const word = fixed ? Object.assign({}, base, { chips: fixed, heart: fixed.some(c=>c.tricky) }) : base;
  const sh = $('#sheet'); sh.classList.remove('hidden');
  const showIpa = S.settings.ipa;
  const inLadder = R && R.kind !== 'book';
  const heartTaught = R && R.tricky && R.tricky.has(base.lw);
  const unknownParts = R && R.known && !heartTaught ? word.chips.filter(c => !c.punct && (!c.u || !R.known.has(c.u))) : [];
  sh.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(text)}">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">Tap a letter or group</span><button class="iconbtn" id="zClose" aria-label="Close">✕</button></div>
    <div class="chips" style="--cs:${word.chips.length>7?36:word.chips.length>5?46:word.chips.length>4?54:64}px">${word.chips.map((c,i)=>`<button class="chip ${chipClass(c)}" data-i="${i}">
      ${c.tricky?'<span class="hrt">♥</span>':''}<span class="l">${esc(c.t)}</span>${c.t.replace(/[^A-Za-z]/g,'').length>1?'<span class="grp"></span>':''}
      ${showIpa ? `<span class="ip">${c.ipa?'/'+esc(c.ipa)+'/':'—'}</span>` : ''}${c.silent?'<span class="tag">silent</span>':''}</button>`).join('')}</div>
    ${showIpa ? `<div class="zipa">/${esc(word.chips.map(c=>c.ipa).join(''))}/</div>` : ''}
    <div class="zrow"><button class="btn" id="zOut">🔤 Spell it</button><button class="btn alt" id="zSay">🔊 Say it</button></div>
    ${word.heart ? `<div class="note">♥ Heart word: the pink part doesn't follow the usual rules. Learn that bit by heart.</div>` : ''}
    ${word.chips.some(c=>c.magic) ? `<div class="note info">Magic e: the e at the end is silent and makes the vowel say its name.</div>` : ''}
    ${inLadder && unknownParts.length && !word.heart ? `<div class="note info">This word has a sound she hasn't learned yet. Read it together.</div>` : ''}
    ${SAMPLE && !fixed && (R && (R.kind === 'book' || R.long)) ? `<button class="linkbtn" id="zAsk">Looks wrong? Ask Claude to split this word</button>` : ''}
    ${fixed ? `<p class="muted" style="text-align:center">Split by Claude</p>` : ''}
  </div>`;
  const close = () => { stopSpeak(); sh.classList.add('hidden'); sh.innerHTML = ''; };
  sh.onclick = e => { if(e.target === sh) close(); };
  $('#zClose').onclick = close;
  const btns = [...sh.querySelectorAll('.chip')];
  btns.forEach(b => b.onclick = () => { btns.forEach(x=>x.classList.remove('lit')); b.classList.add('lit'); speakChip(word.chips[+b.dataset.i], word).then(()=>b.classList.remove('lit')); });
  $('#zSay').onclick = async () => { stopSpeak(); await wait(40); speak(text.toLowerCase()==='i'?'I':text); };
  $('#zOut').onclick = () => soundOut(word, i => btns.forEach((b,j) => b.classList.toggle('lit', i === -1 ? true : j === i))).then(()=>btns.forEach(b=>b.classList.remove('lit')));
  const ask = $('#zAsk');
  if(ask) ask.onclick = async () => {
    ask.innerHTML = '<span class="spin"></span>'; ask.disabled = true;
    try{
      const res = await SAMPLE.json(`Split the English word "${base.lw}" into phonics sound chunks (graphemes) for a child learning to read, in American English. Group letters that make one sound together (like "sh", "igh", "ea", "ck"), and treat magic e as a silent "e" chunk. Give each chunk's sound in IPA (use symbols like æ ɛ ɪ ɑ ʌ ə ʊ eɪ i aɪ oʊ u ju aʊ ɔɪ ɔ ɝ ɚ ɑr ɔr ʃ tʃ θ ð ŋ dʒ). Use "" for silent letters. Mark tricky true for a chunk that breaks the usual rules. The letters must join to exactly "${base.lw}". Reply with only JSON: {"parts":[{"letters":"...","ipa":"...","tricky":false}]}`, { modelTier:'quick' });
      const parts = res && res.parts;
      if(!Array.isArray(parts) || parts.map(p => p.letters).join('').toLowerCase() !== base.lw) throw 0;
      // re-apply original casing
      let k = 0; const orig = text.replace(/[’']/g,'');
      const chips = parts.map(p => { const t = orig.slice(k, k + p.letters.length); k += p.letters.length; const lt = p.letters.toLowerCase();
        return { t, u: U[lt] ? lt : null, ipa: p.ipa || '', silent: !p.ipa, tricky: !!p.tricky }; });
      aiFix.set(base.lw, chips); openZoom(text);
    }catch(e){ ask.textContent = "Couldn't split it. Try again."; ask.disabled = false; }
  };
}

render();
setTimeout(() => { initCloud(); initCaps(); loadShared(); }, 0);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') loadShared(); });
if('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname.endsWith('github.io')){
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.update();
    reg.addEventListener('updatefound', () => { const w = reg.installing; if(w) w.addEventListener('statechange', () => { if(w.state === 'activated' && hadSW) toast('Updated to the newest version.'); }); });
  }).catch(()=>{});
}
})();
